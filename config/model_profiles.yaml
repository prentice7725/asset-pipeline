schema_version: 1
profiles:
  anima-base:
    prompt_adapter: anima
    positive_prefix: []
    defaults: {}
    sources:
      - https://huggingface.co/circlestone-labs/Anima
  anima-pixel:
    prompt_adapter: anima
    positive_prefix: [pixel art, chibi]
    defaults: {}
    sources:
      - https://huggingface.co/circlestone-labs/Anima
  anima-tomohi:
    prompt_adapter: anima
    positive_prefix: [tomohi]
    defaults: {}
    trigger_source: user-confirmed
  krea2:
    prompt_adapter: krea2
    defaults: {}
    sources:
      - https://github.com/krea-ai/krea-2/blob/main/docs/prompting.md
    community_style_reference: https://kreastyles.thetacursed.com/
  codex-imagegen:
    prompt_adapter: natural_language
    defaults: {}
    notes: Codex CLI 내장 image_gen 도구용 자연어 프롬프트. 네이티브 negative prompt와 seed는 없다.
  grok-imagine:
    prompt_adapter: natural_language
    defaults: {}
    notes: Grok Build CLI 내장 image_gen/image_edit 도구용 자연어 프롬프트. 네이티브 negative prompt와 seed는 없다.
