    style_axes: "medium: GRAPHIC_PRINT; color: SATURATED; form: BOLD_LINE; light: GRAPHIC_TWO_TONE; texture: LOW_RISOGRAPH"
    krea2_base:
      style_clause: "High-contrast poster-like outlines and solid saturated masses; subtle misregistration/paper texture only on surfaces away from key subject."
