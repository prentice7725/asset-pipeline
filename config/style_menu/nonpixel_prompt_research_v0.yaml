# Research-only NONPIXEL_IMAGE menu prompt prototypes. NEVER auto-route or approve.
schema_version: 1
version: '0.1.0'
created_at: '2026-10-04'
status: OFFLINE_PROMPT_STUDY
model_scopes:
  krea2_base:
    profile: krea2
    file: config/workflows/krea2_turbo_api.json
    base_model: krea2_turbo_fp8_scaled.safetensors
    text_encoder: qwen3vl_4b_fp8_scaled.safetensors
    vae: qwen_image_vae.safetensors
    loras: []
    recipe_policy: KREA_NATURAL_LANGUAGE
    model_author_reference: https://github.com/krea-ai/krea-2/blob/main/docs/prompting.md
    config_caution: 'Local graph CFG 1.0 differs from official Turbo OSS example CFG 0.0. Do not silently retune.'
  anima_base:
    profile: anima-base
    file: config/workflows/baseline_anima_api.json
    base_model: anima-base-v1.0.safetensors
    text_encoder: qwen_3_06b_base.safetensors
    vae: qwen_image_vae.safetensors
    loras: []
    recipe_policy: ANIMA_TAGS_PLUS_CAPTION
    model_author_reference: https://huggingface.co/circlestone-labs/Anima
    config_caution: 'Anima character portrait preset 24 steps differs from 30-50 step author baseline. Use same fixed preset within experiment; no implicit optimization.'
global_rules:
  pixel_menus_hold: [STYLE-005]
  no_pixel_generation: true
  cli_providers: SMOKE_ONLY_ALREADY_GENERATED_2026_10_01
  project_sot_is_authoritative: true
  source_prompt_is_not_canonical_subject: true
  base_lora_policy: NONE_UNTIL_SEPARATE_ABLATION
  no_generated_preview_approvals: true
  no_silent_model_or_vae_fallback: true
  styles_proven_better: 0
  adapter_output: RESEARCH_CANDIDATE_NOT_PRODUCTION_RECIPE
source_research:
  - https://kreastyles.thetacursed.com/
  - https://github.com/ThetaCursed/Krea2-Style-Explorer
  - https://github.com/krea-ai/krea-2/blob/main/docs/prompting.md
  - https://www.krea.ai/blog/krea-2-deep-dive-walkthrough
  - https://huggingface.co/circlestone-labs/Anima
recipes:
  STYLE-001:
    label: "cinematic cyberpunk illustration"
    status: RESEARCH_NOT_RUN
    output_class: NONPIXEL_IMAGE
    style_contract_id: STYLE-001
    krea2_base:
      style_clause: "Industrial nighttime noir; red neon accents against charcoal architectural masses; reflective metal as secondary detail; keep silhouettes readable without lens clutter."
      positive_dialect: NATURAL_LANGUAGE
      negative_native: UNSUPPORTED
    anima_base:
      contract_ref: config/styles/catalog.yaml#/styles/STYLE-001/style_contract
      positive_dialect: STRUCTURED_STYLE_CONTRACT
    failure_risk: "Avoid defaulting to literal photographic film grain when project demands clean 2D assets."
    editable_axes: [color, linework, shading, texture, focal_hierarchy]
    locked_axes: [project_subject_identity, equipment, target_resolution, output_class]
    image_validation: NOT_RUN
    repeated_seeds: NOT_RUN
    game_size_validation: NOT_RUN
    human_approval: false
  STYLE-002:
    label: "cybernetic portrait noir"
    status: RESEARCH_NOT_RUN
    output_class: NONPIXEL_IMAGE
    style_axes: "medium: GRAPHIC_PORTRAIT; color: AMBER_COBALT; form: MEDIUM_EDGE; light: SPLIT_RIM; texture: RESTRAINED"
    krea2_base:
      style_clause: "Amber and cobalt dual-tone portrait lighting, sharp cybernetic accents, dark uncluttered negative space; eyewear is optional, not mandatory."
      positive_dialect: NATURAL_LANGUAGE
      negative_native: UNSUPPORTED
    anima_base:
      positive_tags: ["cyberpunk","portrait","blue lighting","orange lighting","dark background","high contrast","sharp focus"]
      natural_language_caption: "A restrained illustrated portrait illuminated by opposing amber and cobalt practical lights. Keep clothing and facial identity from the source brief, with the background subdued and cybernetic design elements only when canon specifies them."
      positive_dialect: TAGS_PLUS_NATURAL_CAPTION
      optional_negative: []
    failure_risk: "Do not introduce glasses, implants, or other foreign subject details from explorer reference."
    editable_axes: [color, linework, shading, texture, focal_hierarchy]
    locked_axes: [project_subject_identity, equipment, target_resolution, output_class]
    image_validation: NOT_RUN
    repeated_seeds: NOT_RUN
    game_size_validation: NOT_RUN
    human_approval: false
  STYLE-003:
    label: "retro twilight gothic cel"
    status: RESEARCH_NOT_RUN
    output_class: NONPIXEL_IMAGE
    style_axes: "medium: RETRO_ANIME; color: INDIGO_MAGENTA; form: CLEAN_LINE; light: TWILIGHT; texture: BACKGROUND_ONLY"
    krea2_base:
      style_clause: "1990s-like animation cel shapes in deep indigo dusk with selective magenta glow; painted atmospheric background but hard contours on the subject."
      positive_dialect: NATURAL_LANGUAGE
      negative_native: UNSUPPORTED
    anima_base:
      positive_tags: ["1990s anime","gothic fantasy","cel shading","watercolor background","twilight","indigo","magenta lighting"]
      natural_language_caption: "A gothic fantasy cel illustration with readable hard-edged figure shading, deep indigo twilight and controlled magenta bioluminescent accents. Background textures are watercolor-like and subordinate to the main subject."
      positive_dialect: TAGS_PLUS_NATURAL_CAPTION
      optional_negative: []
    failure_risk: "Keep painted background texture out of character silhouettes and small icon-sized objects."
    editable_axes: [color, linework, shading, texture, focal_hierarchy]
    locked_axes: [project_subject_identity, equipment, target_resolution, output_class]
    image_validation: NOT_RUN
    repeated_seeds: NOT_RUN
    game_size_validation: NOT_RUN
    human_approval: false
  STYLE-004:
    label: "nonpixel SD illustrated gouache"
    status: RESEARCH_NOT_RUN
    output_class: NONPIXEL_IMAGE
    style_contract_id: STYLE-004
    krea2_base:
      style_clause: "Soft painted gouache with simplified facial construction, compact SD proportions only if authorized in game SOT, warm daylight and grouped colors."
