    status: RESEARCH_NOT_RUN
    output_class: NONPIXEL_IMAGE
    style_axes: "medium: INK_ENGRAVING; color: MUTED_PAPER; form: FINELINE; light: VALUE_BY_HATCH; texture: STIPPLE"
    krea2_base:
      style_clause: "Fine ruled contours, stippled shadows and muted parchment accents; focus on one readable engraving focal mass."
      positive_dialect: NATURAL_LANGUAGE
      negative_native: UNSUPPORTED
    anima_base:
      positive_tags: ["engraving","fine lineart","hatching","stippling","muted colors","storybook illustration","vintage print"]
      natural_language_caption: "An illustrated ink engraving with fine contour linework and controlled cross-hatched values on aged paper. Preserve clear silhouettes and spatial hierarchy, limiting hatch density in critical silhouettes and small props."
      positive_dialect: TAGS_PLUS_NATURAL_CAPTION
      optional_negative: []
    failure_risk: "Do not over-texture equipment silhouettes or invent botanical motifs."
    editable_axes: [color, linework, shading, texture, focal_hierarchy]
    locked_axes: [project_subject_identity, equipment, target_resolution, output_class]
    image_validation: NOT_RUN
    repeated_seeds: NOT_RUN
    game_size_validation: NOT_RUN
    human_approval: false
  STYLE-007:
