    krea2_base:
      style_clause: "Contemporary comic graphic design; unbroken black contours, solid local colors and a few intentional shadow blocks."
      positive_dialect: NATURAL_LANGUAGE
      negative_native: UNSUPPORTED
    anima_base:
      positive_tags: ["modern manga","clean lineart","flat colors","simple background","graphic illustration","cel shading"]
      natural_language_caption: "A contemporary flat manga illustration with strong even linework, simple blocks of local color, limited grouped cel shadows and little surface grain. Faces, hands, clothing and pose must remain faithful to the subject brief."
      positive_dialect: TAGS_PLUS_NATURAL_CAPTION
      optional_negative: []
    failure_risk: "No spontaneous text balloons, signage, or pop-art graphics unless project explicitly requires them."
    editable_axes: [color, linework, shading, texture, focal_hierarchy]
    locked_axes: [project_subject_identity, equipment, target_resolution, output_class]
    image_validation: NOT_RUN
    repeated_seeds: NOT_RUN
