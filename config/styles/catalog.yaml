    style_contract:
      id: STYLE-001
      version: 1.0.0
      medium:
      - stylized 2D science-fiction cyberpunk noir illustration
      palette:
      - deep charcoal and near-black masses dominate
      - saturated red neon accents are visible against the dark palette
      linework:
      - crisp high-contrast contours keep the main silhouette readable
      shading:
      - hard-edged grouped shadows preserve a clear subject silhouette
      lighting:
      - saturated red neon light visibly illuminates a scene surface or reflection
      background:
      - industrial nighttime environment with dark charcoal architectural masses
      - reflective metal remains secondary to the subject
      texture:
      - restrained low-grain surface treatment without photographic lens clutter
      value_structure:
      - deep dark value masses with localized red light and a separated focal silhouette
      required_style_features:
      - code: STYLE001_RED_LIGHT_MISSING
        text: visible saturated red neon light illuminates at least one scene surface or reflection
      - code: STYLE001_DARK_NIGHT_MASS_MISSING
        text: dark charcoal or near-black nighttime masses dominate the background
      - code: STYLE001_INDUSTRIAL_CUES_MISSING
        text: restrained industrial architectural cues support the noir setting
      forbidden_style_features:
      - code: STYLE001_WHITE_NEUTRAL_BACKGROUND_PRESENT
        text: predominantly white or neutral studio background
      - code: STYLE001_PHOTOGRAPHIC_GRAIN_PRESENT
        text: heavy photographic film grain or lens clutter
      priority: 90
      source:
