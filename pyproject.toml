[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-pipeline"
version = "0.1.0"
description = "Workflow-driven game asset production CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "PyYAML>=6", "jsonschema>=4.18", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
motion = ["opencv-python>=4.8"]

[project.scripts]
assetpipe = "assetpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
