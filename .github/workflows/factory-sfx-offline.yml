name: Factory and SFX offline contracts

on:
  pull_request:
    paths:
      - "src/assetpipe/factory/**"
      - "src/assetpipe/audio/**"
      - "src/assetpipe/pipelines/sfx/**"
      - "src/assetpipe/api.py"
      - "src/assetpipe/cli/**"
      - "schemas/factory_request_v1.schema.json"
      - "examples/sfx_*"
      - "tests/unit/test_factory_contract.py"
      - "tests/unit/test_sfx*.py"
      - ".github/workflows/factory-sfx-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline dependencies
        run: python -m pip install -e ".[dev,motion,mcp]"
      - name: Install local audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify real local audio tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Test contracts and synthetic audio without model calls
        run: |
          python -m pytest -q tests/unit/test_factory_contract.py tests/unit/test_sfx.py tests/unit/test_sfx_operations.py tests/unit/test_security_hardening.py integrations/mcp/tests/test_adapter.py
          assetpipe --help
          assetpipe factory --help
          assetpipe sfx-review --help
          assetpipe factory plan --request examples/sfx_short_impact_factory.json
          assetpipe factory plan --request examples/sfx_ui_cue_factory.json
          assetpipe factory plan --request examples/sfx_ambience_factory.json
