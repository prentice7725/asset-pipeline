name: Knowledge Integrity (offline)

on:
  pull_request:
    paths:
      - "config/knowledge/**"
      - "config/model_profiles.yaml"
      - "config/workflow_registry.yaml"
      - "config/styles/**"
      - "src/assetpipe/knowledge/**"
      - "src/assetpipe/cli/**"
      - "tests/unit/test_knowledge.py"
      - ".github/workflows/knowledge-integrity.yml"
  push:
    branches: [main]
    paths:
      - "config/knowledge/**"
      - "config/model_profiles.yaml"
      - "config/workflow_registry.yaml"
      - "config/styles/**"
      - "src/assetpipe/knowledge/**"
      - "src/assetpipe/cli/**"
      - "tests/unit/test_knowledge.py"
      - ".github/workflows/knowledge-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Assert compile and knowledge integrity (no generation)
        run: |
          python -m compileall -q src/assetpipe/knowledge src/assetpipe/cli
          python -m pytest -q tests/unit/test_knowledge.py tests/unit/test_styles.py tests/unit/test_asset_production_skill.py
          assetpipe knowledge --model-id anima-base > /dev/null
          assetpipe knowledge --style-id limited_palette_pixel > /dev/null
